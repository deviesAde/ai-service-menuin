services:
  scantoko-ai:
    image: ghcr.io/deviesade/ai-service-menuin:latest
    build: .
    container_name: scantoko-ai
    ports:
      - "8501:8501"
    volumes:
      # Data produk & upload tetap tersimpan di laptop meski container dimatikan
      - ./uploads:/app/uploads
      - ./backend/products.db:/app/backend/products.db
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
